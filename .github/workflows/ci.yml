name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
        
      # The design tokens are vendored into public/assets and committed, so
      # nothing is fetched at runtime and the container build needs no
      # credentials. This step is what makes a change to the design system show
      # up as a reviewable diff instead of silently restyling the page.
      - name: Design tokens are in sync
        run: npm run check:tokens

      - name: Typecheck
        run: npm run typecheck
        
      - name: Test
        run: npm test

      - name: Docker Build (No Push)
        run: docker build -t seerrsense:test .

