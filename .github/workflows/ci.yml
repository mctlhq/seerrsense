name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    runs-on: ubuntu-latest
    # PostgresAuthStore carries every authorization code and refresh token in
    # production, and its queries are only exercised when TEST_DATABASE_URL
    # points at a real server. Without this the suite still passes — against
    # the in-memory store alone, which is not what production runs.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
        
      # The design tokens are vendored into public/assets and committed, so
      # nothing is fetched at runtime and the container build needs no
      # credentials. This step is what makes a change to the design system show
      # up as a reviewable diff instead of silently restyling the page.
      - name: Design tokens are in sync
        run: npm run check:tokens

      - name: Typecheck
        run: npm run typecheck
        
      - name: Test
        run: npm test
        env:
          # sslmode=disable: the service container serves plaintext, while the
          # store defaults to TLS for the platform database that does not.
          TEST_DATABASE_URL: postgresql://postgres:test@127.0.0.1:5432/postgres?sslmode=disable

      - name: Docker Build (No Push)
        run: docker build -t seerrsense:test .

