name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
        
      - name: Typecheck
        run: npm run typecheck
        
      - name: Test
        run: npm test

      - name: Docker Build (No Push)
        run: docker build -t seerrsense:test .

  release:
    if: github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.MCTL_GITHUB_TOKEN }}
          
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Bump Version and Tag
        id: bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          npm version patch -m "chore: release %s"
          git push --follow-tags
          echo "TAG=$(git describe --tags --abbrev=0)" >> $GITHUB_ENV
          
      - name: Trigger MCTL Deploy
        run: |
          echo "Triggering MCTL deploy-service for tag ${{ env.TAG }}"
          # MCTL deployment controller intercepts tags / we can curl the MCP / MCTL API directly
          # Assuming there's a webhook or MCTL cli in the runner:
          curl -X POST https://api.mctl.ai/deploy \
            -H "Authorization: Bearer ${{ secrets.MCTL_GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"action":"deploy", "team_name":"labs", "component_name":"seerrsense", "dockerfile_repo":"mctlhq/seerrsense", "git_tag":"${{ env.TAG }}"}' || true
